services:
  - type: web
    name: starlink-profile
    runtime: node
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3500
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: starlink
      - key: SESSION_DAYS
        value: 7
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: CLIENT_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PROFILE_CREATE_KEY
        sync: false
